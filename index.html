/* ══════════════════════════════════════════════════════════════════
   firebaseConfig.js — SERVICE MODULE (drop-in Firestore wiring)
   ──────────────────────────────────────────────────────────────────
   PRODUCTION SWAP (real backend in 3 steps):
     1. npm i firebase            (or ESM CDN in your bundler)
     2. import { initializeApp }        from "firebase/app";
        import { getFirestore, collection, addDoc, updateDoc, doc,
                 onSnapshot, query, orderBy } from "firebase/firestore";
     3. export const db = getFirestore(initializeApp(firebaseConfig));

   Collections used by this app:
     • "sos_alerts" → addDoc(collection(db,"sos_alerts"), payload)
                      onSnapshot(query(collection(db,"sos_alerts"),
                      orderBy("ts","desc")), snap => …)
     • "shelters"   → live occupancy { occ, cap }

   The MockFirestore below mirrors the exact same surface, so the UI
   code never changes when you go live. ══════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIza…_YOUR_KEY_HERE",

const lsGet=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:v}catch(e){return f}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

class MockFirestore{
  constructor(){this.listeners=[];}
  collection(){return {add:this.add.bind(this), subscribe:this.subscribe.bind(this)};}
  subscribe(fn){this.listeners.push(fn);return ()=>{this.listeners=this.listeners.filter(x=>x!==fn)};}
  add(doc){const saved=JSON.parse(lsGet('hg_user_sos','[]'));saved.unshift(doc);
    lsSet('hg_user_sos',JSON.stringify(saved));this.listeners.forEach(f=>f(doc));return doc;}
}
const DB = new MockFirestore();

const Spark=({data,color})=>{
 if(!data||data.length<2)return null;
 const min=Math.min(...data),max=Math.max(...data),sp=(max-min)||1;
 const pts=data.map((v,i)=>`${(i/(data.length-1)*100).toFixed(1)},${(26-((v-min)/sp)*22).toFixed(1)}`).join(' ');
 return <svg viewBox="0 0 100 28" className="h-7 w-24 opacity-90"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/></svg>;
};

function contour(cx,cy,r,seed){
 const N=26,pts=[];
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2;
   const rad=r*(1+.16*Math.sin(3*a+seed)+.11*Math.cos(5*a+seed*1.7)+.05*Math.sin(7*a+seed*2.3));
   pts.push([cx+rad*Math.cos(a),cy+rad*Math.sin(a)*.72]);}
 return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' Z';
}

const SOSModal=({lang,t,onClose,onSubmit})=>{

 const [gps,setGps]=useState({status:'locating',coord:''});
 const [err,setErr]=useState('');
 useEffect(()=>{
   let alive=true;
   if(!navigator.geolocation){setGps({status:'fail',coord:''});return;}
   navigator.geolocation.getCurrentPosition(
     p=>{if(alive)setGps({status:'ok',coord:`${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`})},
     ()=>{if(alive)setGps({status:'fail',coord:''})},
     {timeout:7000,maximumAge:60000});
   return ()=>{alive=false};
 },[]);
 useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose()};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[]);
 const submit=e=>{
   e.preventDefault();
   if(!form.name.trim())return setErr(t('errName'));
   if(!/^[+\d][\d\s-]{9,14}$/.test(form.phone.trim()))return setErr(t('errPhone'));
   if(gps.status!=='ok'&&!form.landmark.trim())return setErr(t('errLoc'));

const CommanderView=({alerts,teams,setTeams,t,lang,onSiren,pushToast,risk})=>{
 const [filter,setFilter]=useState('all');
 const now=Date.now();
 const sorted=useMemo(()=>{
   const f=filter==='all'?alerts:alerts.filter(a=>a.priority===filter);
   return [...f].sort((a,b)=>PRIO[b.priority].w-PRIO[a.priority].w||(b.ts-a.ts));},[alerts,filter]);
 const active=alerts.filter(a=>a.status!=='evacuated').length;
 const deployed=teams.filter(x=>x.status==='deployed').length;
 const evac=214+alerts.filter(a=>a.status==='evacuated').reduce((n,a)=>n+a.people,0);
 const dispatch=id=>{
   const idx=teams.findIndex(x=>x.status==='standby');
   const teamName=idx>=0?teams[idx].name:'NDRF Reserve';
   if(idx>=0)setTeams(ts=>ts.map((x,i)=>i===idx?{...x,status:'deployed'}:x));
   onDispatchAlert(id,teamName);};
 const download=()=>{
   const head=['ID','Timestamp','Name','Contact','Situation','People','Priority','Status','Team','Location','GPS'];
   const rows=alerts.map(a=>[a.id,new Date(a.ts).toISOString(),a.name,a.phone,a.sit,a.people,a.priority,a.status,a.team||'',
     '"'+(a.loc||'').replace(/"/g,'""')+'"',a.gps||'']);
   const csv='\uFEFF'+[head,...rows].map(r=>r.join(',')).join('\n');
   const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
   const el=document.createElement('a');el.href=url;el.download='himalayaguard_incident_report.csv';el.click();
   URL.revokeObjectURL(url);pushToast(t('toastReport'),'ok','download');};
 return (
 <main className="mx-auto max-w-[1600px] px-4 py-5">
   <div className="mb-4 flex flex-wrap items-end justify-between gap-3">
     <div><h2 className="font-display text-2xl font-bold tracking-wide text-slate-50">{t('cmdHead')}</h2>
          <p className="text-[12px] text-slate-500">{t('cmdSub')}</p></div>
     <Chip color={risk>=75?'#EF4444':'#F59E0B'} blink>{t('watchPill')} · AI {risk}%</Chip>
   </div>
   <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
     <StatTile icon="bell"   color="#EF4444" label={t('stActive')} value={active} delay="0ms"/>
     <StatTile icon="truck"  color="#3B82F6" label={t('stTeams')}  value={deployed+4} delay="60ms"/>
     <StatTile icon="users"  color="#10B981" label={t('stEvac')}   value={evac} delay="120ms"/>
     <StatTile icon="clock"  color="#F59E0B" label={t('stResp')}   value="18 min" delay="180ms"/>
   </div>
   <div className="mt-4 grid gap-4 xl:grid-cols-[minmax(0,1fr)_340px]">
     <section className="glass anim-rise rounded-2xl p-4" style={{animationDelay:'120ms'}}>
       <div className="flex flex-wrap items-center justify-between gap-2">
         <h3 className="flex items-center gap-2 font-display text-lg font-bold tracking-wide text-slate-50">
           <span className="anim-blink h-2 w-2 rounded-full bg-danger"/>{t('feedTitle')}</h3>
         <div className="flex gap-1.5">
           {['all','critical','high','medium'].map(f=>(
             <button key={f} onClick={()=>setFilter(f)}
               className={`btn-press rounded-full px-3 py-1 text-[11px] font-bold ${filter===f?'bg-slate-100 text-[#0A0D14]':'glass-soft text-slate-300 hover:text-white'}`}>
               {f==='all'?t('all'):t(PRIO[f].key)}</button>))}
         </div>
       </div>
       <div className="mt-3 flex flex-col gap-3">
         {sorted.length===0 && <p className="py-8 text-center text-sm text-slate-500">{t('noSos')}</p>}
         {sorted.map(a=><AlertCard key={a.id} a={a} lang={lang} t={t} now={now} onDispatch={dispatch}
            onEvac={id=>onEvacAlert(id)}/>)}
       </div>
     </section>
     <aside className="flex flex-col gap-4">
       <section className="glass anim-rise rounded-2xl p-4" style={{animationDelay:'180ms'}}>
         <button onClick={onSiren} className="btn-press flex w-full items-center justify-center gap-2.5 rounded-xl border border-danger/50 bg-gradient-to-b from-danger/30 to-danger/10 py-4 font-display text-base font-bold tracking-wide text-red-200 shadow-[0_0_30px_rgba(239,68,68,.18)]">
           <Icon name="siren" className="h-5 w-5 anim-blink"/>{t('siren')}</button>
         <button onClick={download} className="btn-press mt-2.5 flex w-full items-center justify-center gap-2 rounded-xl border border-slate-600/40 bg-[#0D1220] py-3 text-[13px] font-bold text-slate-200 hover:border-accent/60">
           <Icon name="download" className="h-4 w-4 text-accent"/>{t('report')}</button>
       </section>
       <section className="glass anim-rise rounded-2xl p-4" style={{animationDelay:'240ms'}}>
         <h3 className="font-display text-base font-bold tracking-wide text-slate-50">{t('rosterTitle')}</h3>
         <div className="mt-2.5 flex flex-col gap-2">
           {teams.map(x=>(
             <div key={x.name} className="glass-soft flex items-center justify-between rounded-lg px-3 py-2">
               <span className="text-[12px] font-semibold text-slate-200">{x.name}</span>
               <Chip color={x.status==='deployed'?'#F59E0B':'#10B981'}>{x.status==='deployed'?t('deployed'):t('standby')}</Chip>
             </div>))}
           <div className="glass-soft flex items-center justify-between rounded-lg px-3 py-2">
             <span className="text-[12px] font-semibold text-slate-200">MI-17 · Jolly Grant</span>
             <Chip color="#3B82F6">{t('airReady')}</Chip></div>
         </div>
       </section>
     </aside>
   </div>
 </main>);
};

/* ══════════════ SIREN OVERLAY ══════════════ */
const SirenOverlay=({t,onClose})=>{
 const stop=useRef(false);
 useEffect(()=>{try{
   const ctx=new (window.AudioContext||window.webkitAudioContext)();
   const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.connect(g);g.connect(ctx.destination);
   g.gain.value=.05;const nowT=ctx.currentTime;
   for(let i=0;i<3;i++){o.frequency.setValueAtTime(640,nowT+i*1.1);o.frequency.linearRampToValueAtTime(960,nowT+i*1.1+.55);o.frequency.linearRampToValueAtTime(640,nowT+i*1.1+1.1);}
   o.start(nowT);o.stop(nowT+3.35);stop.current=()=>{try{o.stop()}catch(e){}};
 }catch(e){} const id=setTimeout(onClose,6500);return()=>{clearTimeout(id);if(stop.current)stop.current()}},[]);
 return (
 <div className="fixed inset-0 z-[60] grid place-items-center bg-[#1a0505]/85 p-4 backdrop-blur-sm">
   <div className="glass w-full max-w-lg rounded-2xl border-2 border-danger p-6 text-center" style={{animation:'sirenFlash 1s ease-in-out infinite'}}>
     <Icon name="siren" className="mx-auto h-12 w-12 text-danger"/>
     <h2 className="mt-3 font-display text-3xl font-bold tracking-wide text-red-300">{t('sirenTitle')}</h2>
     <p className="mt-1 text-sm font-bold text-warn">{t('sirenZone')}</p>
     <p className="mt-3 text-[13.5px] leading-relaxed text-slate-200">{t('sirenSub')}</p>
     <button onClick={onClose} className="btn-press mt-5 rounded-xl bg-danger px-6 py-2.5 font-display text-base font-bold text-white">{t('ack')}</button>
   </div>
 </div>);
};

/* ══════════════ ROOT APP ══════════════ */
function App(){
 const [lang,setLangState]=useState(lsGet('hg_lang','en'));
 const setLang=l=>{setLangState(l);lsSet('hg_lang',l)};
 const t=k=>(L[lang][k]!==undefined?L[lang][k]:L.en[k]!==undefined?L.en[k]:k);
 const [view,setView]=useState('citizen');
 const [sosOpen,setSosOpen]=useState(false);
 const [siren,setSiren]=useState(false);
 const [toasts,setToasts]=useState([]);
 const toastId=useRef(0);
 const [tele,setTele]=useState({precip:90,cloud:.82,river:2.6,soil:86,slope:.31});
 const hist=useRef({precip:[],river:[],soil:[]});
 const [shelters,setShelters]=useState(SHELTERS);
 const [alerts,setAlerts]=useState(()=>[...JSON.parse(lsGet('hg_user_sos','[]')),...SEED_SOS]);
 const [teams,setTeams]=useState([{name:'NDRF-02 · Varanasi',status:'standby'},{name:'NDRF-12 · Bhatni',status:'deployed'},
   {name:'SDRF Unit-04 · Pauri',status:'standby'},{name:'Helo Task Force · Phata',status:'standby'}]);
 const simDone=useRef(false);

 const pushToast=(msg,type='info',icon)=>{const id=++toastId.current;setToasts(x=>[...x,{id,msg,type,icon}]);};
 const dismiss=id=>setToasts(x=>x.filter(t=>t.id!==id));

 useEffect(()=>{document.documentElement.lang=lang;document.title=(lang==='hi'?'हिमालय गार्ड':'HimalayaGuard AI')+' · SIH 26192 · NDRF'},[lang]);

 /* live telemetry simulation */
 useEffect(()=>{
   const id=setInterval(()=>{setTele(x=>{
     const n={precip:clamp(x.precip+rnd(-3,3),68,112),cloud:clamp(x.cloud+rnd(-.03,.03),.6,.97),
       river:clamp(x.river+rnd(-.09,.1),1.6,3.4),soil:clamp(x.soil+rnd(-1.2,1.2),74,95),slope:clamp(x.slope+rnd(-.02,.02),.18,.5)};
     hist.current.precip=[...hist.current.precip,n.precip].slice(-24);
     hist.current.river=[...hist.current.river,n.river].slice(-24);
     hist.current.soil=[...hist.current.soil,n.soil].slice(-24);
     return n;});},2500);
   return()=>clearInterval(id);},[]);
 /* shelter occupancy drift */
 useEffect(()=>{const id=setInterval(()=>setShelters(ss=>ss.map(s=>{
     const occ=clamp(s.occ+Math.round(rnd(-2,2)),Math.round(s.cap*.4),Math.round(s.cap*.97));return {...s,occ};}));},6000);
   return()=>clearInterval(id);},[]);
 /* scripted incoming SOS */
 useEffect(()=>{const id=setTimeout(()=>{if(simDone.current)return;simDone.current=true;
     setAlerts(a=>[{id:'SOS-7852',ts:Date.now(),name:'Anil Semwal',phone:'9634007812',sit:'water',people:3,
       loc:'Devprayag ghat steps',gps:'30.1465, 78.6088',priority:'high',status:'new'},...a]);
     pushToast(t('toastNew')+' · Devprayag','danger','bell');},22000);
   return()=>clearTimeout(id);},[lang]);

 const risk=useMemo(()=>{const pn=(tele.precip-40)/80,rn=tele.river/4,sn=(tele.soil-50)/50;
   return clamp(Math.round(135*(.45*pn+.3*rn+.25*sn)),5,99)},[tele]);
 const eta=clamp(Math.round(180-risk),45,150);

 const submitSOS=a=>{DB.collection().add(a);setAlerts(x=>[a,...x]);setSosOpen(false);pushToast(t('toastSos'),'ok','send');};
 const dispatchAlert=(id,team)=>{setAlerts(x=>x.map(a=>a.id===id?{...a,status:'dispatched',team}:a));pushToast(t('toastDispatch'),'info','truck');};
 const evacAlert=id=>{setAlerts(x=>x.map(a=>a.id===id?{...a,status:'evacuated'}:a));pushToast(t('toastEvac'),'ok','checkCircle');};
 const fireSiren=()=>{setSiren(true);pushToast(t('toastSiren'),'warn','siren');};

 const st=tele;
 return (
 <div lang={lang} className="font-body min-h-screen">
   <Header lang={lang} setLang={setLang} view={view} setView={setView} risk={risk} t={t}/>
   <Ticker lang={lang} t={t}/>

   {view==='citizen' ? (
   <main className="mx-auto max-w-[1600px] px-4 py-5">
     <div className="grid gap-4 xl:grid-cols-[minmax(0,1fr)_360px]">
       <div className="flex min-w-0 flex-col gap-4">
         {/* multi-source feeds */}
         <div>
           <div className="mb-2.5 flex items-baseline justify-between">
             <h2 className="font-display text-lg font-bold tracking-wide text-slate-50">{t('feedsTitle')}</h2>
             <p className="text-[11px] text-slate-500">{t('feedsSub')}</p></div>
           <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
             <FeedCard delay="0ms" icon="satellite" sparkColor="#3B82F6" title={t('sat')} sub={t('satSub')}
               value={st.precip.toFixed(1)} unit={lang==='hi'?'मिमी/घं':'mm/hr'}
               status={st.precip>95?t('crit'):t('warn')} statusColor={st.precip>95?'#EF4444':'#F59E0B'}
               spark={hist.current.precip} footL={t('satSub').split('·')[1]} footR={'CBX '+(st.cloud).toFixed(2)}/>
             <FeedCard delay="60ms" icon="waves" sparkColor="#60A5FA" title={t('river')} sub={t('riverSub')}
               value={(66+st.river).toFixed(1)} unit="m"
               status={st.river>2.4?t('crit'):t('warn')} statusColor={st.river>2.4?'#EF4444':'#F59E0B'}
               spark={hist.current.river} footL={'+'+st.river.toFixed(2)+' '+t('aboveDanger')} footR="CN 66.0 m"/>
             <FeedCard delay="120ms" icon="layers" sparkColor="#F59E0B" title={t('soil')} sub={t('soilSub')}
               value={st.soil.toFixed(0)} unit="%"
               status={st.soil>85?t('crit'):st.soil>78?t('warn'):t('ok')}
               statusColor={st.soil>85?'#EF4444':st.soil>78?'#F59E0B':'#10B981'}
               spark={hist.current.soil} footL={t('soilSub').split('·')[1]} footR={'LSI '+(st.slope*100).toFixed(0)}/>
             <GaugeCard delay="180ms" risk={risk} eta={eta} t={t}/>
           </div>
         </div>
         <MapPanel lang={lang} t={t} shelters={shelters} openSos={()=>setSosOpen(true)}/>
       </div>
       <Sidebar lang={lang} t={t} shelters={shelters}/>
     </div>
   </main>)
   :
   (<CommanderView alerts={alerts} teams={teams} setTeams={setTeams} t={t} lang={lang} risk={risk}
      onSiren={fireSiren} pushToast={pushToast}
      onDispatchAlert={dispatchAlert} onEvacAlert={evacAlert}/>)}

   <footer className="mt-6 border-t border-slate-800/70 px-4 py-5 text-center">
     <p className="text-[12px] font-semibold text-slate-400">{t('footer1')}</p>
     <p className="mt-1 text-[11px] text-slate-600">{t('footer2')} · Firebase-ready (collections: <span className="font-mono">sos_alerts, shelters</span>)</p>
   </footer>

   {sosOpen && <SOSModal lang={lang} t={t} onClose={()=>setSosOpen(false)} onSubmit={submitSOS}/>}
   {siren && <SirenOverlay t={t} onClose={()=>setSiren(false)}/>}
   <div className="fixed bottom-4 right-4 z-[70] flex w-[min(360px,90vw)] flex-col gap-2">
     {toasts.map(x=><Toast key={x.id} t={x} dismiss={dismiss}/>)}
   </div>
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
